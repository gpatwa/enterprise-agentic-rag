# .github/workflows/ci-gate.yml
# The single status check to require on main. It runs for every pull request (no path filter), works out which
# per-product workflows apply to the changed files, and waits for exactly those. See .github/scripts/ci_gate.py.
name: CI gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - run: pip install pyyaml==6.0.3 pytest==8.3.4
      - name: Test the gate logic
        run: python -m pytest .github/scripts -q
      - name: Wait for the workflows that apply to this pull request
        run: python .github/scripts/ci_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
