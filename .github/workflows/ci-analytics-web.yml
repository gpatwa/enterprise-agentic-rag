# .github/workflows/ci-analytics-web.yml
# Analytics web CI: type-check, production build, image build.
name: CI (analytics web)

on:
  push:
    branches: [main]
    paths:
      - "apps/analytics-web/**"
      - ".github/workflows/ci-analytics-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/analytics-web/**"
      - ".github/workflows/ci-analytics-web.yml"

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analytics:
    name: Analytics Web Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analytics-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/analytics-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  product-image:
    name: Web Docker Build (analytics-web)
    runs-on: ubuntu-latest
    needs: [analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: apps/analytics-web
          file: apps/analytics-web/Dockerfile
          push: false
          tags: compass-analytics-web:ci-${{ github.sha }}
