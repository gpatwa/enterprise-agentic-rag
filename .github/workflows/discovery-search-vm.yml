name: Discovery search VM (start / stop)

# Manual only. Starts or deallocates the on-demand OpenSearch VM created by infra/terraform/azure-discovery-pilot.
# While the VM is off the Discovery API serves the in-memory catalog (responses carry fallback: true).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the search VM
        required: true
        type: choice
        options:
          - start
          - stop
          - status
      environment:
        description: GitHub deployment environment
        required: true
        type: environment

permissions:
  contents: read
  id-token: write

jobs:
  vm:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply the requested action
        env:
          ACTION: ${{ inputs.action }}
          RG: ${{ secrets.DISCOVERY_RESOURCE_GROUP }}
          VM: ${{ secrets.DISCOVERY_SEARCH_VM_NAME }}
        run: |
          case "$ACTION" in
            start)  az vm start -g "$RG" -n "$VM" ;;
            stop)   az vm deallocate -g "$RG" -n "$VM" ;;
            status) ;;
          esac
          az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv
