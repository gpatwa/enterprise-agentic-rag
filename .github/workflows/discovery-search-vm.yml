name: Discovery search VM (start / stop)

# Manual only. Starts or deallocates the on-demand OpenSearch VM created by infra/terraform/azure-discovery-pilot.
# While the VM is off the Discovery API serves the in-memory catalog (responses carry fallback: true).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the search VM
        required: true
        type: choice
        options:
          - start
          - stop
          - status
      environment:
        description: GitHub deployment environment (must be one Terraform allows to sign in; default setup is discovery-pilot)
        required: true
        type: environment

permissions:
  contents: read
  id-token: write

jobs:
  vm:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # OIDC only: no client secret exists. The identity can start, deallocate and read this one VM and nothing else.
      # All five values are repository variables (identifiers, not secrets) set by `make discovery-repo-vars`.
      - name: Check the repository variables are set
        env:
          CLIENT_ID: ${{ vars.DISCOVERY_AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.DISCOVERY_AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.DISCOVERY_AZURE_SUBSCRIPTION_ID }}
          RG: ${{ vars.DISCOVERY_RESOURCE_GROUP }}
          VM: ${{ vars.DISCOVERY_SEARCH_VM_NAME }}
        run: |
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RG VM; do
            [ -n "${!name}" ] || { echo "::error::A repository variable is not set ($name). Run 'make discovery-repo-vars' from a checkout where 'terraform apply' has been done."; exit 1; }
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DISCOVERY_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.DISCOVERY_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.DISCOVERY_AZURE_SUBSCRIPTION_ID }}
      - name: Apply the requested action
        env:
          ACTION: ${{ inputs.action }}
          RG: ${{ vars.DISCOVERY_RESOURCE_GROUP }}
          VM: ${{ vars.DISCOVERY_SEARCH_VM_NAME }}
        run: |
          case "$ACTION" in
            start)  az vm start -g "$RG" -n "$VM" ;;
            stop)   az vm deallocate -g "$RG" -n "$VM" ;;
            status) ;;
          esac
          az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv
