# .github/workflows/ci-support-web.yml
# Support (Resolution Intelligence) web CI: type-check, Vitest, Playwright E2E, production build, image build.
name: CI (support web)

on:
  push:
    branches: [main]
    paths:
      - "apps/support-web/**"
      - ".github/workflows/ci-support-web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/support-web/**"
      - ".github/workflows/ci-support-web.yml"

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/support-web

jobs:
  # ──────────────────────────────────────────────────
  # 1. Type-check + Vitest unit tests + lint.
  #    Fast (~30s); runs on every push/PR.
  # ──────────────────────────────────────────────────
  unit:
    name: Type-check & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/support-web/package-lock.json

      - name: Install dependencies
        # `npm install` rather than `npm ci` because lockfile drift between
        # contributor npm versions has shown up under ubuntu-latest's npm 10
        # vs Mac's npm 11. We accept the slight nondeterminism in alpha CI
        # to keep the pipeline green; tighten to `npm ci` once the team
        # standardises on a Volta-pinned npm version.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest unit tests
        run: npm test

  # ──────────────────────────────────────────────────
  # 2. Production build — verifies the whole bundle pipeline:
  #    TypeScript compile and Vite chunk splitting.
  # ──────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/support-web/package-lock.json

      - name: Install dependencies
        # `npm install` rather than `npm ci` because lockfile drift between
        # contributor npm versions has shown up under ubuntu-latest's npm 10
        # vs Mac's npm 11. We accept the slight nondeterminism in alpha CI
        # to keep the pipeline green; tighten to `npm ci` once the team
        # standardises on a Volta-pinned npm version.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build
        env:
          VITE_SITE_URL: https://compass.example.com
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || (echo "MISSING dist/index.html" && exit 1)
          echo "Build artifacts present."

      - name: Bundle-size budget check (informational)
        run: |
          echo "::group::Built JS chunk sizes"
          ls -lah dist/assets/*.js | awk '{print $5, $9}'
          echo "::endgroup::"
          # Soft warn if entry chunk exceeds 200 KB raw — current is ~115 KB.
          ENTRY_BYTES=$(stat -c %s dist/assets/index-*.js | head -1)
          if [ -n "$ENTRY_BYTES" ] && [ "$ENTRY_BYTES" -gt 204800 ]; then
            echo "::warning ::entry bundle is ${ENTRY_BYTES} bytes (>200KB) — consider lazy-loading more"
          fi

  # ──────────────────────────────────────────────────
  # 3. Playwright E2E — runs the page.route()-mocked flow.
  #    Slower (~1-2min). Separate job so unit failures fail fast.
  # ──────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/support-web/package-lock.json

      - name: Install dependencies
        # `npm install` rather than `npm ci` because lockfile drift between
        # contributor npm versions has shown up under ubuntu-latest's npm 10
        # vs Mac's npm 11. We accept the slight nondeterminism in alpha CI
        # to keep the pipeline green; tighten to `npm ci` once the team
        # standardises on a Volta-pinned npm version.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/support-web/playwright-report/
          retention-days: 7

  product-image:
    name: Web Docker Build (support-web)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: apps/support-web
          file: apps/support-web/Dockerfile
          push: false
          tags: compass-support-web:ci-${{ github.sha }}
