# .github/workflows/ci-analytics.yml
# Analytics backend CI. Support has its own workflow: ci-support.yml.
name: CI (analytics backend)

on:
  push:
    branches: [main]
    paths:
      - "services/analytics-api/**"
      - "packages/**"
      - "pyproject.toml"
      - "infra/terraform/azure-analytics-pilot/**"
      - ".github/workflows/ci-analytics.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analytics-api/**"
      - "packages/**"
      - "pyproject.toml"
      - "infra/terraform/azure-analytics-pilot/**"
      - ".github/workflows/ci-analytics.yml"

env:
  # Pin to 3.12.3 specifically: Python >=3.12.5 made ForwardRef._evaluate
  # require a `recursive_guard` kwarg, which pydantic v1 (used transitively
  # by langsmith via langgraph) doesn't pass — 5 tests fail at import time.
  # Bump after upgrading langgraph / langsmith / pydantic accordingly.
  PYTHON_VERSION: "3.12.3"

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analytics-test:
    name: Analytics API Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/analytics-api/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check app tests ../../packages --output-format=github

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/analytics-api:${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build (analytics-api)
    runs-on: ubuntu-latest
    needs: [analytics-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/analytics-api/Dockerfile
          push: false
          tags: compass-analytics-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
