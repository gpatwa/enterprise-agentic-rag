schema_version: 1
program_id: agentic-data-stack
source_plan: ../../AGENTIC_DATA_STACK_EXECUTION_PLAN.md
status: in_progress

status_values:
  - planned
  - ready
  - in_progress
  - blocked
  - review
  - complete

rules:
  packet_directory: .
  packet_name: "<TASK-ID>-<short-name>.md"
  one_task_per_branch: true
  commit_required: true
  independent_review_required: true
  push_after_milestone: true
  no_self_approval:
    - architecture
    - security
    - semantic_certification
    - threshold_change
    - final_go_no_go

validation:
  - ruff check packages/platform_contracts services/analytics-api/app services/analytics-api/tests
  - (cd services/analytics-api && PYTHONPATH=.:../.. pytest -q)
  - git diff --check

milestones:
  M0:
    name: Program and graph foundations
    status: complete
    waves:
      - [ADS-001, ADS-007, ADS-008]
      - [ADS-002]
      - [ADS-003]
      - [ADS-004, ADS-005, ADS-006]
      - [ADS-009]
    human_gate: architecture_and_security
  M1:
    name: Ontology and context layer
    status: in_progress
    waves:
      - [ADS-010, ADS-012, ADS-013, ADS-014]
      - [ADS-011, ADS-015]
      - [ADS-016, ADS-017, ADS-018, ADS-019]
    human_gate: semantic_certification
  M2:
    name: Deterministic agent harness
    status: in_progress
    waves:
      - [ADS-020, ADS-021, ADS-022]
      - [ADS-023, ADS-024, ADS-025]
      - [ADS-026, ADS-027, ADS-028, ADS-029]
    human_gate: threshold_and_harness_review
  M3:
    name: Governed agent graph
    status: planned
    waves:
      - [ADS-030, ADS-031, ADS-032, ADS-033]
      - [ADS-034, ADS-035, ADS-036]
      - [ADS-037, ADS-038, ADS-039]
    human_gate: graph_and_policy_review
  M4:
    name: Live read-only execution and evidence
    status: planned
    waves:
      - [ADS-040, ADS-044]
      - [ADS-041, ADS-042, ADS-043]
      - [ADS-045, ADS-046, ADS-047]
      - [ADS-048, ADS-049]
    human_gate: local_demo_review
  M5:
    name: Safe learning and correction loops
    status: planned
    waves:
      - [ADS-050, ADS-051]
      - [ADS-052, ADS-053, ADS-054]
      - [ADS-055, ADS-056, ADS-057]
      - [ADS-058, ADS-059]
    human_gate: separation_of_duties_review
  M6:
    name: Agent-operable and enterprise runtime
    status: planned
    waves:
      - [ADS-060, ADS-062, ADS-063]
      - [ADS-061, ADS-064, ADS-065]
      - [ADS-066, ADS-067, ADS-068, ADS-069]
    human_gate: security_and_operations_review
  M7:
    name: Final evaluation and pilot decision
    status: planned
    waves:
      - [ADS-070]
      - [ADS-071, ADS-072, ADS-073, ADS-074, ADS-075, ADS-076, ADS-077, ADS-078]
      - [ADS-079]
    human_gate: final_go_no_go

