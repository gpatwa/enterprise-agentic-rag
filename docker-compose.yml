# docker-compose.yml

services:
  # 1. Postgres (Chat History)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Redis (Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 3. Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.7.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Opt-in enterprise search plane. This deliberately does not alter the
  # default Qdrant demo; start it with `docker compose --profile search up`.
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    profiles: ["search", "analytics", "products", "observability"]

  # Local-only search administration UI. Security is intentionally disabled in
  # the dev OpenSearch profile; keep this service behind an SSH tunnel.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    profiles: ["search", "analytics", "products", "observability"]

  # 4. Neo4j (Graph DB)
  neo4j:
    image: neo4j:5.16.0-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # 5. MinIO (S3 Mock) - Optional for full offline dev
  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - rag-network
    profiles: ["tools"]

  # Product deployables. Start all four with:
  # docker compose --profile products up --build
  support-api:
    build:
      context: services/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql+asyncpg://ragadmin:changeme@postgres:5432/rag_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ragadmin
      - DB_PASSWORD=changeme
      - DB_NAME=rag_db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - JWT_SECRET_KEY=local-product-secret-change-me
      - CORS_ORIGINS=http://localhost:5173
      - OTEL_EXPORTER=${OTEL_EXPORTER:-none}
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
    profiles: ["support", "products"]

  support-web:
    build:
      context: apps/support-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - SUPPORT_API_HOST=support-api:8080
    depends_on:
      - support-api
    profiles: ["support", "products"]

  analytics-api:
    build:
      context: .
      dockerfile: services/analytics-api/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - ENV=dev
      - ANALYTICS_DB_URL=postgresql://ragadmin:changeme@postgres:5432/rag_db
      - ANALYTICS_DEMO_MODE=${ANALYTICS_DEMO_MODE:-true}
      - ANALYTICS_OPENSEARCH_URL=${ANALYTICS_OPENSEARCH_URL:-http://opensearch:9200}
      - ANALYTICS_CONTEXT_INDEX=${ANALYTICS_CONTEXT_INDEX:-context-v1}
      - ANALYTICS_DASHBOARDS_URL=${ANALYTICS_DASHBOARDS_URL:-http://opensearch-dashboards:5601}
      - ANALYTICS_CONTEXT_BOOTSTRAP=${ANALYTICS_CONTEXT_BOOTSTRAP:-true}
      - ANALYTICS_LLM_MODEL=${ANALYTICS_LLM_MODEL:-gpt-4o-mini}
      - ANALYTICS_LLM_BASE_URL=${ANALYTICS_LLM_BASE_URL:-}
      - ANALYTICS_LLM_API_KEY=${ANALYTICS_LLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANALYTICS_CORS_ORIGINS=http://localhost:5174
    depends_on:
      postgres:
        condition: service_started
      opensearch:
        condition: service_healthy
    profiles: ["analytics", "products"]

  analytics-web:
    build:
      context: apps/analytics-web
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    environment:
      - ANALYTICS_API_HOST=analytics-api:8090
    depends_on:
      - analytics-api
    profiles: ["analytics", "products"]

  # ─── Local operations plane ────────────────────────────────────────────
  # Start with: docker compose --profile observability up -d

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles: ["observability"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    profiles: ["observability"]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://ragadmin:changeme@postgres:5432/rag_db?sslmode=disable
    depends_on:
      - postgres
    profiles: ["observability"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      - redis
    profiles: ["observability"]

  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
    command: ["--es.uri=http://opensearch:9200"]
    depends_on:
      opensearch:
        condition: service_healthy
    profiles: ["observability"]

  # ─── Split-plane services ──────────────────────────────────────────────
  # Start with: docker compose --profile split up

  # Control Plane (SaaS management layer)
  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENV=dev
      - DATABASE_URL=sqlite+aiosqlite:///control_plane.db
      - JWT_SECRET_KEY=dev-secret-change-in-production
      - INTERNAL_API_KEY=internal-dev-key
      - CORS_ORIGINS=*
      - STATIC_DIR=/app/static
    depends_on:
      - postgres
      - redis
    networks:
      - rag-network
    profiles: ["split"]

  # Data Plane (query processing in customer environment)
  data-plane:
    build:
      context: .
      dockerfile: services/data-plane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEPLOYMENT_MODE=data_plane
      - SINGLE_TENANT_MODE=true
      - DATA_PLANE_ID=dp-local-001
      - CONTROL_PLANE_URL=http://control-plane:8001
      - DATA_PLANE_API_KEY=dev-dp-key
      - INTERNAL_API_KEY=internal-dev-key
      - HEARTBEAT_INTERVAL_SECONDS=30
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ragadmin
      - DB_PASSWORD=changeme
      - DB_NAME=rag_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - control-plane
    networks:
      - rag-network
    profiles: ["split"]

networks:
  rag-network:
    driver: bridge

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
