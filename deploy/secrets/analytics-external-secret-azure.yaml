# Analytics-only Key Vault sync. Apply after the ClusterSecretStore in
# external-secrets-azure.yaml exists and the corresponding secrets are present.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: analytics-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: analytics-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANALYTICS_DB_URL
      remoteRef:
        key: analytics-db-url
    - secretKey: ANALYTICS_CONTROL_DB_URL
      remoteRef:
        key: analytics-control-db-url
    - secretKey: ANALYTICS_LLM_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: ANALYTICS_RUN_ID_KEY
      remoteRef:
        key: analytics-run-id-key
    - secretKey: ANALYTICS_API_KEY
      remoteRef:
        key: analytics-api-key
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: azure-openai-api-key
