# deploy/ray/ray-cluster.yaml
# Dev/Learning config — downsized for cost. See comments for production values.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: rag-ray-cluster
  namespace: default
spec:
  # Ray Version: Must match your Python SDK version
  rayVersion: '2.60.0'

  ###################################
  # HEAD NODE (The Manager)
  # Orchestrates tasks but does no heavy lifting.
  ###################################
  headGroupSpec:
    serviceType: ClusterIP # Internal communication only
    rayStartParams:
      dashboard-host: '0.0.0.0' # Enable dashboard for monitoring
      num-cpus: '0' # Don't run tasks on head node

    template:
      spec:
        # Head node doesn't need GPU — use multi-arch image (amd64 + arm64)
        nodeSelector:
          kubernetes.io/arch: amd64
        containers:
        - name: ray-head
          image: rayproject/ray:2.60.0-py310
          env:
          # Sink settings (Qdrant, Neo4j, OpenSearch). The driver (this pod, on the head) and the workers both read them.
          # Qdrant and Neo4j are the Helm releases the bootstrap scripts install; their Services are named after the release.
          - name: QDRANT_HOST
            value: "qdrant"
          - name: QDRANT_PORT
            value: "6333"
          - name: NEO4J_URI
            value: "bolt://neo4j:7687"
          - name: NEO4J_USER
            value: "neo4j"
          # OpenSearch is external, so its endpoint comes from the optional ConfigMap ray-sink-config.
          - name: OPENSEARCH_URL
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_URL
                optional: true
          - name: OPENSEARCH_AUTH_MODE
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_AUTH_MODE
                optional: true
          # Credentials: one key each from the dedicated secret ray-sink-credentials (never app-env-secret); pods start without it.
          - name: NEO4J_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: NEO4J_PASSWORD
                optional: true
          - name: OPENSEARCH_USERNAME
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_USERNAME
                optional: true
          - name: OPENSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_PASSWORD
                optional: true
          - name: OPENSEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_API_KEY
                optional: true
          resources:
            # Dev: 1 CPU / 4Gi (prod: 2 CPU / 8Gi)
            limits:
              cpu: "1"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "4Gi"
          ports:
          - containerPort: 6379 # Redis port (Ray uses Redis internally)
          - containerPort: 8265 # Dashboard port

  ###################################
  # WORKER GROUPS (The Muscle)
  ###################################
  workerGroupSpecs:

  # GROUP A: CPU Workers (For Ingestion: PDF Parsing, Text Splitting)
  # Dev: scales 0-3 with smaller instances (prod: 1-50 with c6i.2xlarge)
  - groupName: cpu-workers
    replicas: 0
    minReplicas: 0       # Scale to zero when idle (prod: 1)
    maxReplicas: 3       # Cap for dev budget (prod: 50)
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.60.0-py310 # CPU Image
          # Gemini key for the ingestion embedder (INGEST_EMBED_PROVIDER=gemini). A dedicated single-key secret, not
          # app-env-secret: Ray must not see the database URL or JWT secret. optional: pods still start without it.
          env:
          - name: GOOGLE_API_KEY
            valueFrom:
              secretKeyRef:
                name: ray-gemini-api-key
                key: GOOGLE_API_KEY
                optional: true
          # Sink settings (Qdrant, Neo4j, OpenSearch). The driver (this pod, on the head) and the workers both read them.
          # Qdrant and Neo4j are the Helm releases the bootstrap scripts install; their Services are named after the release.
          - name: QDRANT_HOST
            value: "qdrant"
          - name: QDRANT_PORT
            value: "6333"
          - name: NEO4J_URI
            value: "bolt://neo4j:7687"
          - name: NEO4J_USER
            value: "neo4j"
          # OpenSearch is external, so its endpoint comes from the optional ConfigMap ray-sink-config.
          - name: OPENSEARCH_URL
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_URL
                optional: true
          - name: OPENSEARCH_AUTH_MODE
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_AUTH_MODE
                optional: true
          # Credentials: one key each from the dedicated secret ray-sink-credentials (never app-env-secret); pods start without it.
          - name: NEO4J_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: NEO4J_PASSWORD
                optional: true
          - name: OPENSEARCH_USERNAME
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_USERNAME
                optional: true
          - name: OPENSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_PASSWORD
                optional: true
          - name: OPENSEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_API_KEY
                optional: true
          resources:
            # Dev: 2 CPU / 8Gi (prod: 8 CPU / 32Gi on c6i instances)
            limits:
              cpu: "2"
              memory: "8Gi"
            requests:
              cpu: "2"
              memory: "8Gi"
        # Node Selector: Tells Karpenter to use cost-effective CPU nodes
        nodeSelector:
          karpenter.k8s.aws/instance-family: "t3a"  # Dev: burstable (prod: c6i)

  # GROUP B: GPU Workers (For Embeddings, Graph Extraction, LLM Inference)
  # Scale-to-zero: Only runs when actively inferencing (~$0.60/hr on SPOT)
  - groupName: gpu-workers
    replicas: 0
    minReplicas: 0        # Scale to zero when idle (key cost saver!)
    maxReplicas: 2        # Cap for dev budget (prod: 20)
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.60.0-py310-gpu
          # Gemini key for the ingestion embedder (INGEST_EMBED_PROVIDER=gemini). A dedicated single-key secret, not
          # app-env-secret: Ray must not see the database URL or JWT secret. optional: pods still start without it.
          env:
          - name: GOOGLE_API_KEY
            valueFrom:
              secretKeyRef:
                name: ray-gemini-api-key
                key: GOOGLE_API_KEY
                optional: true
          # Sink settings (Qdrant, Neo4j, OpenSearch). The driver (this pod, on the head) and the workers both read them.
          # Qdrant and Neo4j are the Helm releases the bootstrap scripts install; their Services are named after the release.
          - name: QDRANT_HOST
            value: "qdrant"
          - name: QDRANT_PORT
            value: "6333"
          - name: NEO4J_URI
            value: "bolt://neo4j:7687"
          - name: NEO4J_USER
            value: "neo4j"
          # OpenSearch is external, so its endpoint comes from the optional ConfigMap ray-sink-config.
          - name: OPENSEARCH_URL
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_URL
                optional: true
          - name: OPENSEARCH_AUTH_MODE
            valueFrom:
              configMapKeyRef:
                name: ray-sink-config
                key: OPENSEARCH_AUTH_MODE
                optional: true
          # Credentials: one key each from the dedicated secret ray-sink-credentials (never app-env-secret); pods start without it.
          - name: NEO4J_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: NEO4J_PASSWORD
                optional: true
          - name: OPENSEARCH_USERNAME
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_USERNAME
                optional: true
          - name: OPENSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_PASSWORD
                optional: true
          - name: OPENSEARCH_API_KEY
            valueFrom:
              secretKeyRef:
                name: ray-sink-credentials
                key: OPENSEARCH_API_KEY
                optional: true
          resources:
            # Dev: sized for g5.xlarge (4 vCPU, 16GB RAM, 1x A10G)
            # Prod: increase to 4 CPU / 32Gi for g5.4xlarge with 70B model
            limits:
              cpu: "3"
              memory: "14Gi"
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: "10Gi"
              nvidia.com/gpu: 1
        # Node Selector: Tells Karpenter to use GPU nodes
        nodeSelector:
          karpenter.k8s.aws/instance-category: "g"
        # Tolerations: Allow scheduling on Tainted GPU nodes
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
