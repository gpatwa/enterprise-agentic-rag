# deploy/helm/api/values-prod.yaml
# Production environment overrides — HA, resource-optimized, minimal logging.
# Usage: helm upgrade --install api deploy/helm/api -f values-azure.yaml -f values-prod.yaml

replicaCount: 2

image:
  pullPolicy: IfNotPresent

env:
  ENV: "prod"
  LOG_LEVEL: "WARNING"
  SUPPORT_JOB_WORKER_ENABLED: "false"
  # Qdrant and Neo4j are the Helm releases the bootstrap scripts install; their Services are named after the release
  # (`qdrant` on 6333, `neo4j` on bolt 7687), the same as the config defaults. They are set explicitly anyway, and
  # QDRANT_PORT especially: Kubernetes injects QDRANT_PORT=tcp://<ip>:6333 for a Service named qdrant, which is not an integer.
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://neo4j:7687"
  # The API refuses to start with ENV=prod (the default) and a wildcard or empty CORS_ORIGINS. Least privilege: only the
  # API's own origin (api.<dns_zone_name>), so no other site's browser code can call it. Add a web app's origin here, as
  # a comma-separated list, when it has a domain.
  CORS_ORIGINS: "https://api.patwa-rag-platform.com"
  # Keyless Azure OpenAI (Entra ID tokens from the pod's workload identity): no provider API key to store or rotate.
  # The endpoint is deterministic (infra/terraform/azure/openai.tf: https://<cluster_name>-openai.openai.azure.com/).
  # Embeddings use text-embedding-3-small at 768 dims, matching the 768-dim indexes (default 1536 is not requested).
  LLM_PROVIDER: "azure_openai"
  EMBED_PROVIDER: "azure_openai"
  AZURE_OPENAI_ENDPOINT: "https://rag-platform-aks-openai.openai.azure.com/"
  AZURE_OPENAI_LLM_DEPLOYMENT: "gpt-4o-mini"
  AZURE_OPENAI_EMBED_DEPLOYMENT: "text-embedding-3-small"
  AZURE_OPENAI_EMBED_DIMENSIONS: "768"
  # Re-ranking — cross-encoder via Ray Serve for best accuracy (~50ms)
  RERANKER_PROVIDER: "cross_encoder"
  RERANKER_SCORE_THRESHOLD: "0.3"
  RERANKER_ENDPOINT: "http://reranker-service:8000/rerank"
  # Agentic pipeline — tool endpoints
  SANDBOX_URL: "http://sandbox-service:8080/execute"
  # TAVILY_API_KEY: loaded from app-env-secret

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

supportWorker:
  enabled: true
  replicaCount: 1
  env:
    SUPPORT_JOB_WORKER_ENABLED: "true"

migrations:
  enabled: true
