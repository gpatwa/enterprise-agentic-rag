# deploy/helm/api/values-azure.yaml
# Azure Helm overrides for the RAG API.
# Usage: helm upgrade --install api deploy/helm/api -f deploy/helm/api/values-azure.yaml
#
# These values override the base values.yaml for Azure deployments.
# Key differences from AWS:
#   - Image pulled from ACR (not ECR)
#   - Secrets from Azure Key Vault (not AWS Secrets Manager)
#   - Workload Identity annotations (not IRSA annotations)
#   - Tolerations for Azure Spot node pools

replicaCount: 1  # Dev: 1 replica (prod: 2+ for HA)

image:
  # Azure Container Registry URI — set ACR_NAME and TAG at deploy time:
  #   --set image.repository=<ACR_NAME>.azurecr.io/rag-backend-api
  #   --set image.tag=<TAG>
  repository: ragplatformacr.azurecr.io/rag-backend-api
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Azure-specific: Tolerate Spot node pools
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

# Azure-specific: Workload Identity annotations for the service account
serviceAccount:
  create: true
  name: api-sa
  annotations:
    # Set API_IDENTITY_CLIENT_ID from terraform output:
    #   --set serviceAccount.annotations."azure\.workload\.identity/client-id"=<CLIENT_ID>
    azure.workload.identity/client-id: ""

# Azure-specific pod label required for Workload Identity
podLabels:
  azure.workload.identity/use: "true"

# Environment variables specific to Azure deployment.
# IMPORTANT: every key in `env:` is rendered as a Pod-level env var which
# OVERRIDES the corresponding key from `envFrom: secretRef`. Don't list
# anything here that we want loaded from the K8s secret — including
# AZURE_KEY_VAULT_URL, DATABASE_URL, REDIS_URL, etc. These come from
# `app-env-secret` via the bootstrap script.
env:
  CLOUD_PROVIDER: "azure"
  STORAGE_PROVIDER: "azure_blob"
  VECTORDB_PROVIDER: "qdrant"
  GRAPHDB_PROVIDER: "neo4j"
  # Qdrant and Neo4j are the Helm releases the bootstrap scripts install; their Services are named after the release
  # (`qdrant` on 6333, `neo4j` on bolt 7687), the same as the config defaults. They are set explicitly anyway, and
  # QDRANT_PORT especially: Kubernetes injects QDRANT_PORT=tcp://<ip>:6333 for a Service named qdrant, which is not an integer.
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://neo4j:7687"
  # The API refuses to start with ENV=prod (the default) and a wildcard or empty CORS_ORIGINS. Least privilege: only the
  # API's own origin (api.<dns_zone_name>), so no other site's browser code can call it. Add a web app's origin here, as
  # a comma-separated list, when it has a domain.
  CORS_ORIGINS: "https://api.patwa-rag-platform.com"
  LLM_PROVIDER: "openai"
  # Gemini at 768 dims: matches the 768-dim OpenSearch index (OpenAI text-embedding-3-small is 1536).
  # GOOGLE_API_KEY comes from app-env-secret; the bootstrap script reads it from Key Vault (gemini-api-key).
  EMBED_PROVIDER: "gemini"
  GEMINI_EMBED_DIMENSIONS: "768"
  SECRETS_PROVIDER: "azure_kv"
  # AZURE_KEY_VAULT_URL deliberately omitted — comes from app-env-secret.
